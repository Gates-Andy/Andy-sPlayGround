<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layouts/default}">

	<div layout:fragment="contents" 
		class=" d-flex justify-content-center align-items-center text-center">
		<div class="leftpicture">
			<img alt="leftpicture" height="800"
				src="https://cdn.pixabay.com/photo/2014/10/18/20/51/swing-493710_1280.jpg">
		</div>
		<div class="userbox ml-5">
		
			<header class="text-center">
				<h3 class="">ANDY's PLAYGROUND</h3>
				<br>
				<h5 class="">Meet up friends nearby</h5>
			</header>
			
			<form id="loginForm">
			<section class="contents text-center">
			
				
					<div>loginId</div>
					<input type="text" class="form-control mb-1" id="loginIdInput" placeholder="loginId">
					<div>password</div>
					<input type="password" class="form-control mb-1" id="passwordInput" placeholder="password"><br>
					<button type="submit" class="form-control btn btn-danger mb-3"  id="loginBtn" >Join now</button>
				
				
				<div class="text-center mt-4">
					<a href="/user/join/view">Create Account</a>
				</div>
				
				<br>
				
				<h5>Download the app here</h5>
				
				<div class="d-flex">
					<img class="playstore"> <img class="appstore">
				</div>
				
			</section>
			</form>
			
		</div>
	</div>
	
	<script layout:fragment="script">
	
		$("#loginForm").on("submit",function(e){
			// form 태그 원래의 기능을 제거 
			e.preventDefault();
			
			let loginId = $("#loginIdInput").val();
			let password = $("#passwordInput").val();
			
			if (loginId == ""){
				alert("Please check your ID");
				return;
			}
			
			if (password == ""){
				alert("Please check your password");
				return;
			}
			
			$.ajax({
				type : "post"
				, url : "/user/login"
				, data : {
					"loginId" : loginId,
					"password" : password
				},
				success : function(response){
					if(response.result == "success"){
						location.href = "/post/timeline"
					} else {
						alert("Please check your ID and Password");
					}
				},
				error : function(response){
					alert("로그인 에러");
				}
				
			});
			
		});
	</script>
</html>
