<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Welcome to The Andy's Playground</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
	integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
	crossorigin="anonymous">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
	<div id="wrap">
	
	<div class=" d-flex justify-content-center align-items-center text-center">
	
		<div class="leftpicture">
			<img alt="leftpicture" height="800" src="https://news.samsungdisplay.com/wp-content/uploads/2018/08/8.jpg">
		</div>

		<div class="userbox">
			<header class="text-center">
				<h3 class="">ANDY's PLAYGROUND</h3> <br>
				<h5 class="">Meet up friends nearby</h5>
			</header>
			
			<section class="text-center">
				<div>Email address</div>
				<input type="text" placeholder="emailaddress">

				<div>password</div>
				<input type="password" placeholder="password">
				
				<div>name</div>
				<input type="text" placeholder="name">
				
				<div>username</div>
				<input type="text" placeholder="username">
				
				<div>
					Someone using our service may have uploaded<br>
					your contact information to ANDY’s PlayGround.<br>
					Learn more
				</div>
				
				<button type="button" class="btn btn-danger mt-3">Join now</button>
			</section>
			
			<footer class="text-center">
				<h5>Do you have an acccount?</h5><br>
				<h5>Download the app here</h5>
				<div class="d-flex">
					<img class="playstore">
					<img class="appstore">
				</div>
			</footer>
			
		</div>

		<div class="rightpicture">
			<img alt="rightpicture" width="300" src="https://news.samsungdisplay.com/wp-content/uploads/2018/08/8.jpg">
		</div>
	
	</div>
				
	</div>
</body>
</html>
