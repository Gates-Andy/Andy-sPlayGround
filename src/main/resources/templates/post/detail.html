<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Andy's PlayGround</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/style2.css">
</head>

<body>
	<div id="wrap">

		<!-- header -->
		<header
			class="d-flex justify-content-between align-items-start px-4 py-3 ">
			<div class="logo-area display-3">My Meet UP</div>
			<div class="logout-area d-flex flex-column align-items-end">
				<div th:if="${session.userId != null}">
					<span th:text="'Welcome ' + ${session.userName}"></span>
				</div>
				<a href="/post/timeline/view" class="text-danger">MeetUP</a> <a
					href="/user/logout" class="text-danger">logout</a>
			</div>
		</header>
		<!-- header -->

		<section class="main">
			<div class="title-area display-4 text-center">MY TIMELINE</div>

			<!-- 카드 -->
			
				<div th:each="post : ${postList}" th:if="${post.userId} == ${session.userId}" th:data-id="${post.id}" id="postListContents" class="content d-flex justify-content-center align-items-center mb-5 border rounded p-4">
					
					<div class="flexbox flex-column">
						<div class="userId font-weight-bold mb-3" th:text="${post.loginId}">userName</div>
						<img class="mr-5 mt-1" width="500" alt="Post Image" th:src="${post.imagePath != null} ? ${post.imagePath} : '/images/default.jpg'" />
					</div>

					<div class="contents-area mt-3 ml-5 w-50">
						<p>
							<strong class="text-danger">Party Name:</strong> <span class="text-success" th:text="${post.title}" id="titleInput"></span>
						</p>
						<p>
							<strong th:text="${post.contents}" id="contentsInput" class="text-info"></strong>
						</p>
						<p>
							<strong class="text-danger">Where:</strong> <span th:text="${post.place}" id="placeInput"></span>
						</p>
						<p>
							<strong class="text-danger">When:</strong> <span>09.August.2025</span>
						</p>

						<div>
							<i th:unless="${post.isLike}" class="bi bi-heart text-danger heartIcon" th:data-post-id="${post.id}"></i> 
							<i th:if="${post.isLike}" class="bi bi-heart-fill text-danger"></i>
							<p class="text-primary" th:text="${post.likeCount} + ' people like this meet up group'"></p>
						</div>

						<div>
							<input type="text" class="form-control col-6" th:id="|commentInput${post.id}|" name="text" />
							<button class="comment-btn btn btn-make mt-2" th:data-post-id="${post.id}">☰ Message To the Householder</button>

							<div th:each="comment : ${post.commentList}">
								<p>
									<strong class="text-danger" th:text="${comment.loginId}">loginId</strong> : <span class="text-warning" th:text="${comment.text}">Comment</span>
								</p>
							</div>

						</div>

					<!-- 삭제 및 편집 zone -->
					<div class="d-flex justify-content-end">

						<a th:href="@{/post/update/view(id=${post.id})}" class="btn btn-make mt-3 mr-2">Edit</a>

						<button type="button" class="btn btn-make mt-3" id="deleteBtn">Delete</button>

					</div>

					<!-- 카드 -->

				</div>
			</div>

		</section>

		<footer class="d-flex justify-content-center align-items-center">
			<div>Copyright 2025. Andy's Play Ground All rights reserved.</div>
		</footer>

	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

	<script>
		$("#deleteBtn").on("click", function() {

			let id = $("#postListContents").data("id");

			$.ajax({
				type : "delete",
				url : "/post/delete",
				data : {
					"id" : id
				},
				success : function(response) {
					if (response.result === "success") {
						alert("Delete success!");
						location.href = "/post/timeline/view";
					} else {
						alert("Delete fail");
					}
				},
				error : function() {
					alert("Delete error!");
				}
			});
		});

		$(".comment-btn").on("click", function() {
			let postId = $(this).data("post-id");
			// let comment = $(this).prev().val();
			let comment = $("#commentInput" + postId).val();

			$.ajax({
				type : "post",
				url : "/post/comment/create",
				data : {
					"postId" : postId,
					"text" : comment
				},
				success : function(response) {
					if (response.result == "success") {
						location.reload();
					} else {
						alert("Comment write fail");
					}
				},
				error : function() {
					alert("Comment write error!");
				}
			});
		});

		$(".heartIcon").on("click", function() {
			let postId = $(this).data("post-id");

			$.ajax({
				type : "post",
				url : "/post/like",
				data : {
					"postId" : postId
				},
				success : function(response) {
					if (response.result == "success") {
						location.reload();
					} else {
						alert("like fail");
					}
				},
				error : function() {
					alert("like error!");
				}
			});
		});
	</script>

</body>
</html>
