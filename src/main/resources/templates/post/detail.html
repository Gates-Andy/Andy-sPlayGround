<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Andy's PlayGround</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
	integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
	crossorigin="anonymous">
<link rel="stylesheet" href="/css/style2.css">
</head>
<body>
	<div id="wrap">
		<header>
			<h1 class="text-center">Let's Meet up</h1>
		</header>

		<section>

			<input type="text" class="form-control mb-2" id="partyNameInput" placeholder="partyname" th:value="${sns.title}" value=""> 
			<input type="text" class="form-control mb-2" id="userIdInput" placeholder="userid" th:value="${sns.loginId}"value="">

			<textarea class="form-control mb-2" rows="10" id="contentsInput" placeholder="contents" th:text="${sns.contents}"></textarea>
			
			<img th:src="${sns.imagePath}">
			
			<input type="file" class="mt-3 text-danger" id="fileInput">

			<div class="d-flex justify-content-between mt-4">
				<a href="/post/timeline/view" class="btn mt-3">To The Timeline</a>
				<button type="button" class="btn" id="saveBtn">V Make a meet up</button>
			</div>

		</section>

		<footer class="d-flex justify-content-center align-items-center">

			<div>Copyright 2025. Andy's Play Ground All rights reserved.</div>

		</footer>

	</div>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
		crossorigin="anonymous"></script>

	<script layout:fragment="script">
		$("#saveBtn").on("click", function() {

			let partyName = $("#partyNameInput").val();
			let userId = $("#userIdInput").val();
			let contents = $("#contentsInput").val();
			let file = $("#fileInput")[0].files[0];

			if (partyName == "") {
				alert("파티 이름을 입력하세요");
				return;
			}

			if (userId == "") {
				alert("사용자 ID를 입력하세요");
				return;
			}

			if (contents == "") {
				alert("내용을 입력하세요");
				return;
			}

			let formData = new FormData();
			formData.append("partyName", partyName);
			formData.append("userId", userId);
			formData.append("contents", contents);
			formData.append("imageFile", file);

			$.ajax({
				type : "post",
				url : "/post/create",
				data : formData,
				enctype : "multipart/form-data",
				processData : false,
				contentType : false,
				success : function(response) {
					if (response.result == "success") {
						location.href = "/post/timeline/view";
					} else {
						alert("글 작성 실패");
					}
				},
				error : function() {
					alert("글 작성 에러");
				}
			});
		});
	</script>

</body>
</html>
