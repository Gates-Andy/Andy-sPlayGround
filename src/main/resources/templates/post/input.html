<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Andy's PlayGround</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="/css/style2.css">
</head>
<body>

	<div id="wrap">

		<h1>Let's meet up</h1>

		<div class="form-container">
		
			<div class="form-group">
				<label for="titleInput">TITLE</label> <input type="text" class="form-control" id="titleInput" placeholder="Enter title">
			</div>
			
			<div class="form-group">
				<label for="contentsInput">Contents</label>
				<textarea class="form-control" rows="5" id="contentsInput" placeholder="Tell your idea of today's meet up"></textarea>
			</div>
			
			<div class="form-group icon-label">
				<img src="https://img.icons8.com/ios-filled/50/000000/map.png" /> <span>Location</span>
			</div>
			
			<textarea class="form-control" rows="2" id="locationInput" placeholder="Mike's cabin mapo sogyo-dong, 358-110 · seoul"></textarea>
			
			
			<!-- 
			<div class="form-group icon-label">
				<img src="https://img.icons8.com/ios-filled/50/000000/clock--v1.png" />
				<span>At</span>
			</div>
			<textarea class="form-control" rows="2" id="timeInput">Every week on Friday until July 10, 2025</textarea>
 			-->
 			
 			
			<div class="upload-section">
				<label class="btn"> ✓ UploadFile <input type="file"
					id="fileInput" hidden>
				</label> <span id="fileName">image.png</span>
			</div>

			<div class="d-flex justify-content-between mt-4">
				<a href="/post/timeline/view" class="btn btn-make">To The List</a>
				<button class="btn btn-make" id="saveBtn">✓ Make a meet up</button>
			</div>
		</div>

		<footer> Copyright 2025. ANDY's PlayGround all rights reserved. </footer>

	</div>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

	<script layout:fragment="script">
		$("#saveBtn").on("click", function() {

			let title = $("#titleInput").val();
			let contents = $("#contentsInput").val();
			let location = $("#locationInput").val();
			let file = $("#fileInput")[0].files[0];
			
			if (title == "") {
				alert("Please Type the title name");
				return;
			}

			if (contents == "") {
				alert("Please Type the contents");
				return;
			}
			
			if (location == "") {
				alert("Please Type the location");
				return;
			}
			
			let formData = new FormData();
			formData.append("title", title);
			formData.append("contents", contents);
			formData.append("location", location);
			formData.append("imageFile", file);

			$.ajax({
				type : "post",
				url : "/post/create",
				data : formData,
				enctype : "multipart/form-data",
				processData : false,
				contentType : false,
				success : function(response) {
					if (response.result == "success") {
						location.href = "/post/timeline/view";
					} else {
						alert("글 작성 실패");
					}
				},
				error : function() {
					alert("글 작성 에러");
				}
			});
		});
	</script>

</body>
</html>
